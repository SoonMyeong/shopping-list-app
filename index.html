<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      padding: 32px 28px;
      height: fit-content;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .input-row input {
      flex: 1;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
    }

    .input-row input:focus { border-color: #5b6af0; }

    .add-btn {
      background: #5b6af0;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .add-btn:hover { background: #4a59e0; }

    .item-list {
      list-style: none;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .item:last-child { border-bottom: none; }

    .item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #5b6af0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-name {
      flex: 1;
      font-size: 15px;
      color: #111;
      transition: color 0.15s;
    }

    .item.checked .item-name {
      text-decoration: line-through;
      color: #bbb;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 17px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
      line-height: 1;
    }

    .delete-btn:hover { color: #e53935; }

    .empty-msg {
      text-align: center;
      color: #ccc;
      font-size: 14px;
      padding: 24px 0;
    }

    .clear-btn {
      display: none;
      margin-top: 16px;
      width: 100%;
      background: none;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 9px;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .clear-btn:hover { border-color: #e53935; color: #e53935; }
    .clear-btn.visible { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <h1>쇼핑 리스트</h1>
    <div class="input-row">
      <input type="text" id="new-item" placeholder="아이템 추가..." autocomplete="off" />
      <button class="add-btn" onclick="addItem()">추가</button>
    </div>
    <ul class="item-list" id="item-list"></ul>
    <button class="clear-btn" id="clear-btn" onclick="clearCompleted()">완료 항목 지우기</button>
  </div>

  <script>
    const KEY = 'shopping-list';

    function loadItems() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch { return []; }
    }

    function saveItems(items) {
      localStorage.setItem(KEY, JSON.stringify(items));
    }

    function render() {
      const items = loadItems();
      const list = document.getElementById('item-list');
      const clearBtn = document.getElementById('clear-btn');

      if (items.length === 0) {
        list.innerHTML = '<li class="empty-msg">리스트가 비어 있습니다.</li>';
      } else {
        list.innerHTML = items.map(item => `
          <li class="item${item.checked ? ' checked' : ''}">
            <input type="checkbox" ${item.checked ? 'checked' : ''}
              onchange="toggleItem(${item.id})" />
            <span class="item-name">${escapeHtml(item.name)}</span>
            <button class="delete-btn" onclick="deleteItem(${item.id})" title="삭제">🗑</button>
          </li>
        `).join('');
      }

      const hasChecked = items.some(i => i.checked);
      clearBtn.classList.toggle('visible', hasChecked);
    }

    function addItem() {
      const input = document.getElementById('new-item');
      const name = input.value.trim();
      if (!name) return;

      const items = loadItems();
      items.push({ id: Date.now(), name, checked: false });
      saveItems(items);
      input.value = '';
      render();
    }

    function toggleItem(id) {
      const items = loadItems();
      const item = items.find(i => i.id === id);
      if (item) item.checked = !item.checked;
      saveItems(items);
      render();
    }

    function deleteItem(id) {
      const items = loadItems().filter(i => i.id !== id);
      saveItems(items);
      render();
    }

    function clearCompleted() {
      const items = loadItems().filter(i => !i.checked);
      saveItems(items);
      render();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.getElementById('new-item').addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });

    render();
  </script>
</body>
</html>
